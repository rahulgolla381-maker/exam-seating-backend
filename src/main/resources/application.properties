spring.application.name=exam-seating

# Import optional local developer properties (application-local.properties is ignored by Git)
spring.config.import=optional:file:application-local.properties,optional:classpath:application-local.properties

# ==============================================================================
# Server Port Configuration
# ==============================================================================
# In production (e.g. Render), PORT is supplied dynamically by the host; defaults to 8083.
server.port=${PORT:8083}

# ==============================================================================
# Database Configuration (MySQL / Aiven / Local)
# ==============================================================================
# Production platforms (e.g. Aiven MySQL) supply SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD.
# Aiven connections require TLS with sslMode=REQUIRED.
# For local development, set environment variables or use application-local.properties (ignored by Git).
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:exam_seating_db}?createDatabaseIfNotExist=true&useSSL=${DB_USE_SSL:false}&allowPublicKeyRetrieval=${DB_ALLOW_PUBLIC_KEY:true}&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USER:root}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==============================================================================
# JPA & Hibernate Configuration
# ==============================================================================
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ==============================================================================
# JWT Authentication Configuration
# ==============================================================================
# Must be supplied via environment variable JWT_SECRET (minimum 256 bits / 32 bytes)
# or in application-local.properties for local development. Never hardcoded.
jwt.secret=${JWT_SECRET:}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ==============================================================================
# CORS Configuration
# ==============================================================================
# In production (Render), set CORS_ALLOWED_ORIGINS to your frontend domain (e.g. https://your-frontend.vercel.app).
# Defaults strictly to local development origins; never a wildcard in production.
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
